# ASUS Zenbook Duo UX8407AA: the top touchscreen (ACPI RAYD0001, PNP0C50-compatible)
# speaks HID-over-I2C, but the native raydium_i2c_ts driver claims it first, misreads
# the protocol (zero axis ranges) and oopses in raydium_i2c_irq on the first touch.
# Blacklist it so i2c-hid-acpi binds the controller instead.
blacklist raydium_i2c_ts

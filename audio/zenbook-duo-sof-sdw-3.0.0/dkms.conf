PACKAGE_NAME="zenbook-duo-sof-sdw"
PACKAGE_VERSION="3.0.0"
AUTOINSTALL="yes"

BUILT_MODULE_NAME[0]="snd-soc-sof-sdw"
DEST_MODULE_LOCATION[0]="/updates"

# The stock Arch kernel is built with GCC; forcing LLVM=1 (as the upstream
# repo did for CachyOS) makes clang reject the kernel's GCC-only cflags.
MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"

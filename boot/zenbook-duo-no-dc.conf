# EXPERIMENT (see README 2a): keep the display engine out of its deep power
# states (DC5/DC6). Theory: re-enabling eDP-2 fails at the PHY's refclk
# request because the PHY is asleep in DC6 and misses the driver's 10 us
# acknowledgement window. If dock/undock works with this, prefer it over the
# backlight/park dock mode. Cost: a little idle power.
KERNEL_CMDLINE[default]+=" xe.enable_dc=0"

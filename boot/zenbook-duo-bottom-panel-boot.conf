# Zenbook Duo UX8407AA: keep the kernel off the bottom panel (eDP-2) during
# boot. Docking the keyboard at the disk-unlock prompt switches that panel
# off under the boot splash, and the xe driver does not survive losing a
# panel it is drawing on (README section 2b). With the connector forced off
# the splash and console use the top screen only; after login
# zenbook-duo-bottom-panel.service re-detects the connector and hands it to
# Hyprland, where the dock watcher takes over.
KERNEL_CMDLINE[default]+=" video=eDP-2:d"

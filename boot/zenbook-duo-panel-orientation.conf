# Zenbook Duo UX8407AA: the top panel (eDP-1) is mounted upside down and the
# kernel has no panel-orientation quirk for this model yet, so tell DRM
# directly. Plymouth, fbcon and Hyprland all read the resulting "panel
# orientation" connector property and rotate on their own; do NOT also set
# transform = 2 in monitors.lua or the panel rotates twice.
# Drop this in /etc/limine-entry-tool.d/ and run `limine-update`.
KERNEL_CMDLINE[default]+=" video=eDP-1:panel_orientation=upside_down"

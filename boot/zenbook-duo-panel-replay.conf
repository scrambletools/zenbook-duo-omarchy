# Zenbook Duo UX8407AA: both OLED panels advertise eDP Panel Replay, and the
# xe driver enables it on eDP-1 by default (xe.enable_psr=0 does NOT cover it,
# Panel Replay has its own switch). With it on, any modeset that touches the
# other pipe — the dock watcher disabling/enabling eDP-2, or a boot with the
# keyboard docked — can stall on "Timed out waiting PSR idle state", after
# which PHY B never comes back and the machine hard-hangs. Turn it off.
KERNEL_CMDLINE[default]+=" xe.enable_panel_replay=0"

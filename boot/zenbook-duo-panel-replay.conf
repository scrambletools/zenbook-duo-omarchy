# Zenbook Duo UX8407AA: both OLED panels advertise eDP Panel Replay and the xe
# driver enables it on eDP-1 by default (xe.enable_psr=0 does not cover it;
# Panel Replay has its own switch). With it on, some boots start with a burst
# of "Timed out waiting for PSR Idle for re-enable" and the first modesets
# then wedge pipe A: the top screen goes dark and the machine has to be
# power-cycled (README section 2a). Turn it off.
KERNEL_CMDLINE[default]+=" xe.enable_panel_replay=0"

# Zenbook Duo UX8407AA: both panels are BOE NB140B9M OLEDs with no PWM
# backlight line; brightness is set over the eDP AUX channel (DPCD). The
# firmware tables tell the Intel driver to use the PWM pin, so every
# brightness change is accepted but nothing on screen moves. Force DPCD
# backlight control instead (1 = enable, driver picks the VESA interface
# these panels advertise). Drop this in /etc/limine-entry-tool.d/ and run
# `limine-update`.
KERNEL_CMDLINE[default]+=" xe.enable_dpcd_backlight=1"
